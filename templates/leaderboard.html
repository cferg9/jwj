<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Journeying With Jesus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=1500') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.25; z-index: -1;
        }
    </style>
</head>
<body class="bg-stone-50 font-sans min-h-screen pb-24">
    <header class="p-8 text-center">
        <h1 class="text-3xl font-extrabold text-stone-800">Top Travelers</h1>
        <p class="text-stone-500 text-sm italic">The most dedicated seekers</p>
    </header>

    <main class="max-w-md mx-auto px-6">
        <div class="space-y-3">
            {% for name, count in travelers %}
            <div class="bg-white/70 backdrop-blur p-5 rounded-3xl flex justify-between items-center shadow-sm border border-white">
                <div class="flex items-center gap-3">
                    <span class="text-lg font-black text-stone-300">#{{ loop.index }}</span>
                    <span class="font-bold text-stone-700">{{ name }}</span>
                </div>
                <span class="bg-amber-600 text-white px-4 py-1 rounded-full text-xs font-black shadow-md shadow-amber-200">
                    {{ count }} Found
                </span>
            </div>
            {% endfor %}
        </div>
        
        <div class="mt-8 p-6 bg-amber-50 rounded-3xl border border-amber-100 text-center">
            <p class="text-xs text-amber-800 font-bold uppercase tracking-widest mb-2">Want to see your trophies?</p>
            <p class="text-sm text-amber-700 mb-4">Submit a find on the home screen to unlock your personalized medal case!</p>
            <a href="/" class="inline-block bg-amber-600 text-white px-6 py-2 rounded-full font-bold text-sm">Start Hunting</a>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-white/90 backdrop-blur shadow-2xl rounded-full px-8 py-4 flex justify-around items-center border border-stone-100">
        <a href="/" class="flex flex-col items-center text-stone-400 hover:text-amber-600">
            <span class="text-xl">🔍</span>
            <span class="text-[10px] font-bold uppercase">Find</span>
        </a>
        <a href="/medals" class="flex flex-col items-center text-amber-600">
            <span class="text-xl">🎖️</span>
            <span class="text-[10px] font-bold uppercase">Rankings</span>
        </a>
    </nav>
</body>
</html>
